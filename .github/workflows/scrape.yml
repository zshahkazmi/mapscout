name: Directory scrape (scheduled)

# Slow, resumable Google Maps scraping into the UK Automotive Directory
# sheet, via the sheet's Apps Script web app (no Google Cloud needed).
# Runs around the clock (user decision 2026-11-01): a fresh run
# starts every 3 hours and the concurrency lock queues it behind
# the one still going, so scraping is effectively continuous. State lives in the sheet's Progress
# tab (read through the endpoint), so every run continues where the last
# one stopped. If Google blocks a run, it stops cleanly (exit 3 ->
# treated as OK) and the next scheduled run resumes.
#
# One-time setup in this repo (Settings -> Secrets and variables -> Actions):
#   MAPSCOUT_API_URL     the Apps Script web app URL (ends in /exec)
#   MAPSCOUT_API_TOKEN   the token set at the top of Code.gs

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      max_queries:
        description: "Queries to process this run"
        type: string
        default: "30"
      min_population:
        description: "Skip localities below this population"
        type: string
        default: "0"

concurrency:
  group: mapscout-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + Chromium
        run: |
          pip install -r requirements.txt -r requirements-sheet.txt
          python -m playwright install --with-deps chromium

      - name: Scrape next chunk into the sheet
        env:
          MAPSCOUT_API_URL: ${{ secrets.MAPSCOUT_API_URL }}
          MAPSCOUT_API_TOKEN: ${{ secrets.MAPSCOUT_API_TOKEN }}
        run: |
          set +e
          python -m mapscout sheet-run \
            --api-url "$MAPSCOUT_API_URL" \
            --api-token "$MAPSCOUT_API_TOKEN" \
            --max-queries "${{ inputs.max_queries || '30' }}" \
            --min-population "${{ inputs.min_population || '0' }}" \
            --delay 4
          code=$?
          if [ $code -eq 3 ]; then
            echo "Stopped early on a Google block - progress saved; the next run resumes."
            exit 0
          fi
          exit $code
